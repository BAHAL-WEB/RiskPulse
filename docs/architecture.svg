<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica,Arial,sans-serif">
<rect width="1000" height="400" fill="#F7F8FA"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5C6879"/></marker></defs>
<text x="30" y="40" font-size="22" font-weight="700" fill="#0F1B2D">RiskPulse architecture</text>
<rect x="30" y="80" width="150" height="40" fill="#1F4E79"/><text x="105" y="106" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Sources</text>
<rect x="30" y="120" width="150" height="90" fill="#fff" stroke="#D9DEE6"/>
<text x="40" y="148" font-size="12" fill="#0F1B2D">News: RSS feeds, GDELT</text><text x="40" y="172" font-size="12" fill="#5C6879">Social: Twitter/X posts</text>
<line x1="182" y1="165" x2="216" y2="165" stroke="#5C6879" stroke-width="2" marker-end="url(#a)"/>
<rect x="220" y="80" width="150" height="40" fill="#1F4E79"/><text x="295" y="106" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Ingestion</text>
<rect x="220" y="120" width="150" height="90" fill="#fff" stroke="#D9DEE6"/>
<text x="230" y="148" font-size="12" fill="#0F1B2D">engine/ingest.py</text><text x="230" y="172" font-size="12" fill="#5C6879">One Document schema</text>
<line x1="372" y1="165" x2="406" y2="165" stroke="#5C6879" stroke-width="2" marker-end="url(#a)"/>
<rect x="410" y="80" width="150" height="40" fill="#0F1B2D"/><text x="485" y="106" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">NLP Risk Engine</text>
<rect x="410" y="120" width="150" height="90" fill="#fff" stroke="#D9DEE6"/>
<text x="420" y="148" font-size="12" fill="#0F1B2D">engine/nlp.py</text><text x="420" y="172" font-size="12" fill="#5C6879">Sentiment, event, impact</text>
<line x1="562" y1="165" x2="596" y2="165" stroke="#5C6879" stroke-width="2" marker-end="url(#a)"/>
<rect x="600" y="80" width="150" height="40" fill="#B3261E"/><text x="675" y="106" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Module B</text>
<rect x="600" y="120" width="150" height="90" fill="#fff" stroke="#D9DEE6"/>
<text x="610" y="148" font-size="12" fill="#0F1B2D">stress/stress_test.py</text><text x="610" y="172" font-size="12" fill="#5C6879">Trigger: impact > 7</text>
<line x1="752" y1="165" x2="786" y2="165" stroke="#5C6879" stroke-width="2" marker-end="url(#a)"/>
<rect x="790" y="80" width="150" height="40" fill="#1B7F5C"/><text x="865" y="106" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Dashboard</text>
<rect x="790" y="120" width="150" height="90" fill="#fff" stroke="#D9DEE6"/>
<text x="800" y="148" font-size="12" fill="#0F1B2D">dashboard.html</text><text x="800" y="172" font-size="12" fill="#5C6879">Before / after, limits</text>
<rect x="600" y="270" width="150" height="60" fill="#fff" stroke="#D9DEE6"/><text x="675" y="297" font-size="12" text-anchor="middle" fill="#0F1B2D">Synthetic portfolio</text><text x="675" y="314" font-size="12" text-anchor="middle" fill="#5C6879">data/sample_portfolio.csv</text>
<line x1="675" y1="268" x2="675" y2="214" stroke="#5C6879" stroke-width="2" marker-end="url(#a)"/>
<rect x="410" y="270" width="150" height="60" fill="#fff" stroke="#D9DEE6"/><text x="485" y="297" font-size="12" text-anchor="middle" fill="#0F1B2D">signals.jsonl + HTTP API</text><text x="485" y="314" font-size="12" text-anchor="middle" fill="#5C6879">/signals, /analyze</text>
<line x1="485" y1="214" x2="485" y2="268" stroke="#5C6879" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="375" font-size="12" fill="#5C6879">Impact above 7 triggers a stress test: event class picks the shock set, impact score scales it, positions are revalued, loss is checked against limits.</text>
</svg>